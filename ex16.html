<!DOCTYPE html>
<html lang="pr-BR">
<head>
    <meta charset="UTF-8">
    <title> Exercicio 16 - Pesquisa de perfil </title>
</head>
<body>
    <h1> Pesquisa de opnião </h1>
    
    <form>
        <h3> Selecione seu gênero: </h3>
        <input type="radio" id="masc" nome="gênero" value="masculino"
        <label for="masc"> masculino </label><br>

        <input type="radio" id="fem" nome="gênero" value="feminino"
        <label for="fem"> Feminino</label><br>

        <input type="radio" id="outro" nome="gênero" value="outro"
        <label for="fem"> Outro</label><br>

        <h3> Quais são seus Hobbies? (Selecione Quantos quiser):</h3>
        <input type=""checkbox" id="futebol" value="futebol">
        <label for="futebol> jogar futebol</label><br>

        <input type=""checkbox" id="cinema" value="cinema">
        <label for="cinema"> Ir ao cinema </label><br>

        <input type=""checkbox" id="musica" value="musica">
        <label for="musica"> Ouvir musica </label><br>

        <button type="submit"> Enviar Respontas</button>

    </form>
</body>
</html>
